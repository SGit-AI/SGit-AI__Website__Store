<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="a jurisdiction boundary with one edge missing">
  <rect width="32" height="32" rx="7" fill="#faf9f5"/>
  <!-- the entity: a closed boundary, transcribed and whole -->
  <path d="M7 11 L13 6 L21 8 L25 14 L22 22 L13 24 L7 19 Z"
        fill="none" stroke="#0f766e" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- the edge that stops short: it leaves the entity and does not arrive -->
  <path d="M25 14 L29 14" fill="none" stroke="#b45309" stroke-width="2.1"
        stroke-linecap="round" stroke-dasharray="1.5 2.6"/>
</svg>
