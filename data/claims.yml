# The ledger. Every factual claim this site makes lives here once, with the state
# it earned and the date it earned it. Pages cite a claim with {{claim:id}}, which
# renders the chip and links back to /ledger/. The "where it is said" column is
# joined at build time, so a claim cannot quietly appear on a page unbadged.
#
# States: exists · spec · unrun · unlocated · booking · partial · absent · docs ·
#         measured · projected   (see build.py STATES)
#
# The pack's rule, and the reason this file is the first thing written rather than
# the last: two of the six things on the offer list do not exist yet, and a store
# whose gaps are edited out is a marketing page wearing a lab coat.

