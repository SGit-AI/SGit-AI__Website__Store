# ---------------------------------------------------------------- the wording
- id: tamper-evident-witness
  state: docs
  date: 10 Sep 2026
  group: The words this site uses, and the words it does not
  claim: "**Tamper evident, given a witness** — never the absolute form of that claim, which is false. A rewritten hash chain verifies against itself; tampering is detectable only when another party already holds an older hash. **The witness is a second clone**, which makes handing somebody a read key the act that makes the claim true. Append-only is stated as **a policy, not a property**."
  source: "02__THE-HARD-RULES.md, rule 14"

- id: cannot-read-unanswered
  state: absent
  date: 10 Sep 2026
  group: The words this site uses, and the words it does not
  claim: "The sentence a reader expects from an encryption product — the one about what its operator can and cannot see — **is not printed on this site in any form**, because six questions about what leaks (filenames, directory structure, object sizes, commit timing, recovery or escrow, support access) **have not been answered**. In November 2020 a regulator acted against a company for claiming end-to-end encryption while its servers held the keys; the settlement imposed **twenty years of third-party assessments**."
  source: "02__THE-HARD-RULES.md, rule 13"

- id: naming-collision-open
  state: absent
  date: 10 Sep 2026
  group: The words this site uses, and the words it does not
  claim: "**Licence to operate** — a permission granted by an authority, ruled 3 September — collides with a second phrase in the same vocabulary, written 17 July, which describes exposure already carried. **They mean opposite things and both are in use.** The collision was recorded on 8 September and **is still open**, so the second phrase appears on no page of this site and a build check keeps it off."
  source: "03__THE-NAMES.md, the open collision"

- id: three-banned-words
  state: docs
  date: 10 Sep 2026
  group: The words this site uses, and the words it does not
  claim: "**Three contested terms** — one for encryption, one for recall, one for autonomy — do not appear anywhere on this site. What is used instead: **end-to-end encrypted** as the primary term, **client-side encryption** as the mechanical one, and **durable** for the property that resumes losslessly. The build fails if any of the three reaches a page. [Each is described on the disclosures page](/disclosures/)."
  source: "02__THE-HARD-RULES.md, rule 12"

