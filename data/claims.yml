# ---------------------------------------------- the lab, and what it is not
# Five prototypes of a purchase flow live at /lab/. A page that looks like a
# checkout and is not one is the most dangerous thing this site could publish, so
# what each of them is NOT is in the ledger before it is on the page.
- id: lab-is-a-prototype
  state: spec
  date: 11 Sep 2026
  group: The lab, and what it is not
  claim: "The five pages at `/lab/` are **prototypes of a purchase flow, not a purchase flow**. **Nothing on them can be bought**, no brief reaches us, no payment link sits behind anything on them, and **which of the five (if any) becomes the real one is not decided.** A build check fails the release if any of them stops saying so."
  source: "build.py, LAB_VIEWS and check_lab_is_marked in tools/check_site.py"

- id: lab-fulfilment-is-people
  state: unrun
  date: 11 Sep 2026
  group: The lab, and what it is not
  claim: "The mapping and policy work these briefs configure is **done by people**. Nothing in it is automated today, **the team specified for it has never run**, and which parts could later be done without them is a decision nobody has taken. A brief is the thing a team would otherwise spend a first call assembling — it is not a delivery."
  source: "01__WHAT-TO-BUILD.md, the tier 4 row, read against what /lab/ configures"

- id: lab-price-is-a-band
  state: exists
  date: 11 Sep 2026
  group: The lab, and what it is not
  claim: "The configurator **does not compute a price.** Weighted selections add up, the total lands in one of four bands, and **each band names one of the four tiers that already exist and its price**. A configurator that emitted a number would be inventing a price, which is the first thing the pack says may not be invented — so the build fails if a band names an offer that is not on the list."
  source: "data/brief.yml, the bands table, and check_lab_bands in tools/check_site.py"

- id: lab-scenarios-are-hypotheses
  state: spec
  date: 11 Sep 2026
  group: The lab, and what it is not
  claim: "The five prebaked scenarios are **shapes somebody might arrive in, not counted frequencies.** **Nobody has measured how common any of them is.** Each brief records which scenario it started from, so that what was assumed stays separable from what was answered — which is the only thing that makes starting from a guess safe."
  source: "data/brief.yml, the scenarios list"

- id: lab-brief-stays-local
  state: exists
  date: 11 Sep 2026
  group: The lab, and what it is not
  claim: "A brief is written to **the browser's own local storage and reaches nothing else.** There is **no form, input, textarea or select anywhere in this site's output** and **no page here opens a network connection** — both held by build checks — so exporting a brief hands the file to the reader rather than to us."
  source: "check_no_forms and check_no_network in tools/check_site.py"


# ------------------------------------------------------------------ the rails
- id: card-reader-refused
  state: docs
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "A United Kingdom card account **cannot tap in Portugal**: the provider declines the transaction on detecting a different country, and says so in those words. **A payment link is an online payment**, so no cross-border rule applies to it. The conclusion the pack draws: **no card reader should be bought**."
  source: "The payment-rail brief, in the pack at /dev-packs/store/"

- id: card-fee-floor
  state: projected
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "**At £5 the fixed card fee alone is about four per cent** of the transaction. On 10 September that was the reason **£10** was the floor rather than £5. On **15 September the project lead set the floor at £5 anyway** — the arithmetic did not change, the judgement did, and **the old reasoning stays on the page rather than being quietly dropped**. Four per cent of a fiver is now a known cost of the cheapest way in, not a reason there isn't one."
  source: "01__WHAT-TO-BUILD.md, the price paragraph, and the pricing ruling of 15 September 2026"

- id: pricing-in-pounds
  state: projected
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "Prices are **in pounds**. Pricing in euros while settling in pounds adds **about two per cent**."
  source: "01__WHAT-TO-BUILD.md, the price paragraph"

- id: marketplace-no-customer-payment
  state: docs
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "The cloud marketplace's seller terms state that a seller is **not permitted to collect customer payment information at any time**. The two rails are therefore **strictly separated**: the marketplace is not a second button beside the card button, it is a different conversation with a different threshold."
  source: "The marketplace brief, in the pack at /dev-packs/store/"

- id: marketplace-fee
  state: docs
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "The marketplace listing fee is **0.5 per cent**, and **falls to zero inside a qualifying multi-product solution**. The pitch is **procurement, not discount**: the buyer already holds the marketplace's legal terms, so there is no master agreement, no vendor onboarding and no new purchase order."
  source: "The marketplace brief, in the pack at /dev-packs/store/"

- id: no-committed-spend
  state: docs
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "**Professional services listings do not draw down committed spend** on the cloud provider. Three independent sources state the exclusion. An earlier version of this claim said the opposite; **the correction is recorded here rather than quietly dropped**, and the old version appears on no page of this site."
  source: "The marketplace brief, correction carried in brief 2 of the pack"

- id: marketplace-registration
  state: spec
  date: 10 Sep 2026
  group: How paying works, and why it works that way
  claim: "Marketplace registration is **the long pole: four to eight weeks**. The listing is therefore **a November surface**, not an event surface, and nothing on this site depends on it."
  source: "01__WHAT-TO-BUILD.md, the surface table"

- id: checkout-links-not-issued
  state: absent
  date: 11 Sep 2026
  group: How paying works, and why it works that way
  claim: "**No payment link has been created for any offer on this site.** Every offer carries a `checkout_url` in `data/offers.yml` and **every one of them is empty**, so each offer shows its code and its delivery page rather than a button. Issuing a checkout is one pasted line; **the gate holds whatever lands there to `buy.stripe.com` or `checkout.stripe.com` over HTTPS**, so a checkout cannot quietly become a redirect through somewhere else."
  source: "data/offers.yml, and check_checkout_links in tools/check_site.py"

- id: checkout-bands-have-no-standing-link
  state: docs
  date: 11 Sep 2026
  group: How paying works, and why it works that way
  claim: "**A standing payment link carries one price, and three of the six offers do not have one.** Tier 2 and tier 3 are bands and tier 4 is a conversation, so **only tier 1 can ever have a standing link**; the banded tiers take a link issued once the band is fixed for the case. That is a property of a fixed-price link, not a policy, and it is why the checkout is not simply four buttons."
  source: "01__WHAT-TO-BUILD.md, the price paragraph, read against how a fixed-price payment link works"

- id: t4-deposit-below-threshold
  state: projected
  date: 11 Sep 2026
  group: The offer line replaced on 15 September 2026
  claim: "**Tier 4's deposit is £500, and it is payable by link.** The fee argument that put tier 4 on the invoice rail was always about the £10,000 and never about the deposit: at £10,000 a card costs up to about £250, and **on the same rate £500 costs about £12**. So **the deposit is a payment link and the balance is not** — two amounts, two rails, one offer. Arithmetic, not an invoice."
  source: "01__WHAT-TO-BUILD.md, the price paragraph, applied to the deposit the same document already describes"

- id: t4-deposit-terms-absent
  state: absent
  date: 11 Sep 2026
  group: The offer line replaced on 15 September 2026
  claim: "**What happens to a deposit against an engagement that cannot be scheduled is not written down.** Until it is, **the deposit follows the conversation and a written scope and is never taken before one** — which is a change to the flow rather than a promise on a page, because a promise about somebody's money that nobody has agreed is worse than an admission that the wording does not exist."
  source: "data/offers.yml, the t4 deposit record, and the same rule that holds the signed-opinion add-on off sale"

