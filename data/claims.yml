# ------------------------------------------- the handover, and the discount code
# The page a buyer lands on AFTER the money moves is not on this site, and the
# brief that settled that is riskmandate.ai/after-payment.md. These six records
# are what that brief left open, written down here rather than in a message,
# because a thing two teams owe each other is exactly the thing that gets
# remembered differently.
- id: post-sale-pages-exist
  state: exists
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**riskmandate.ai publishes one page per level** — `paid-t1` to `paid-t4` — and since its v1.19.2 **the level-one page is the download itself**: the zip, its size, its sha256 and a check that hashes the file in the buyer's own browser against the hash that shape publishes. The size and the hash are **stamped by their build, not typed**, and a stale manifest fails their CI. **This store does not copy any of it**, because two copies of a hash is one hash that will go stale."
  source: "riskmandate.ai/after-payment.md, the table of four levels"

- id: sale-notification-absent
  state: absent
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**Nothing carries a sale from this store to the people who follow up.** Their pages promise a person within 24 hours at the three vault levels, and that person needs the level, the order reference, the address paid with and — at £500 — the template chosen. **A static site cannot send it**: no page here opens a connection and none ever will. So until a rail exists whose receipt reaches them, the channel is the buyer's own first message from the page they land on. **This is the one thing that gates the first paid order at those levels**, and it is written here rather than assumed."
  source: "riskmandate.ai/after-payment.md, item 2 of five"

- id: receipt-reference-untested
  state: unlocated
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**Their pages tell the buyer the order reference is on their receipt. No rail has issued a receipt yet**, so what a real receipt says — and whether it carries the reference under that name or another — is not known. The store generates `SG-` plus six characters from an alphabet with no `0`/`O` or `1`/`I`, and hands it to the provider with the amount. **What comes back on the receipt is the provider's to decide and has not been seen once.**"
  source: "riskmandate.ai/after-payment.md, the open list; data/checkout.yml, every url empty"

- id: level3-return-by-email
  state: partial
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**At £500 the buyer runs `MAP-A-GRANT.md` where the agent runs and sends back `grant.json`, `mandate.json` and the session record, with no secret in them.** That route is **email today**. A write-only vault the buyer drops the files into is the intended route and **does not exist yet**; when it does, their level-three page changes and this store's wording changes with it."
  source: "riskmandate.ai/after-payment.md, the open list"

- id: follow-up-owner-unnamed
  state: unlocated
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**The four pages name one mailbox, and who owns it past the first orders is settled on neither site.** This store names nobody: it links to the page that carries the address, so that when the person or the address changes it is **one change on four pages there and none here**. A mailbox duplicated onto a fifth page is a mailbox that will one day be wrong on one of them."
  source: "riskmandate.ai/after-payment.md, the open list"

- id: opinion-add-on-has-no-page-there
  state: absent
  date: 15 Sep 2026
  group: The handover, and what the two sites owe each other
  claim: "**The opinion add-on is listed here and has no page there.** Their brief says: if the store lists it, say so and the page will be built in the same shape as the four. **This store lists it** — at [/d/add-opinion/](/d/add-opinion/), marked absent, with the wording for a signed opinion recorded as not existing. **The page after payment for it does not exist on either site**, and nothing here says otherwise."
  source: "riskmandate.ai/after-payment.md, item 4 of five; data/offers.yml, add-opinion"

- id: discount-code-is-in-the-browser
  state: partial
  date: 15 Sep 2026
  group: How paying works, and why it works that way
  claim: "**A discount code is recognised by the page, not by a rail.** What ships is **sha256 of the code and never the code**, checked on every release against every byte of the built site — but a short code can be ground out of a hash, and that is said rather than dressed up. **The thing that stops a stranger paying nothing is that a browser does not take money**: a code changes the amount a payment link is issued for, and the rail decides what is charged. **No rail exists yet**, so today a code at a hundred per cent is how the whole flow gets walked without money."
  source: "data/discounts.yml and tools/check_site.py, check_discount_codes_are_not_printed"
