# THE SHORT NAMES, RULED ON 16 SEPTEMBER.
#
# Every offer now carries `short_name` and `short_sub` beside the long `question`
# and `gets`. The pair is the answer to a thing that had been open since the
# concept critique: "Professional review" reads out loud in a board meeting and
# "Two sessions and a custom vault" is the more honest description of what
# arrives, and the store needed both rather than a choice between them.
#
# So: Pack, Vault, Tailored, Reviewed at heading size; the precise line under it.
# The names came out of the v3 design round and were ruled by the project lead.
# check_prices freezes them like every other field here — a name that drifts from
# this file fails the release, which is the point of a name a buyer repeats.
#
# The offers. THIS FILE IS THE ONLY PLACE A PRICE EXISTS.
#
# FOUR LEVELS OF ONE THING, and two add-ons. Every level is the same document — an
# Agent Behaviour Policy for one agent in one deployment — and what changes is the
# form it arrives in and who does the correcting.
#
# THE PRICES CHANGED ON 15 SEPTEMBER 2026, BY RULING. The four tiers of the
# 10 September pack (£10, £50 to £100, £150 to £1,000, £5,000 to £10,000) were
# replaced by the project lead with £5, £50, £500 and £1,500. A price is not the
# builder's to invent and it IS the project lead's to set, so the frozen table in
# tools/check_site.py moved with these numbers, in the commit that says so. That
# mechanism is the point: the check did not loosen, it was re-pointed.
#
# THE IDENTIFIERS DID NOT CHANGE, and that is deliberate. t1 to t4 are printed on
# cards that are already made. A code still lands on /d/<id>/ and that page now
# describes the level rather than the old tier, which is the whole reason the pack
# said to keep the identifiers stable: a repricing costs no reprinting.
#
# `id` is the stable offer identifier. A payment link redirects to /d/<id>/ and
# nothing else about it is load-bearing, so the site can move host without
# reprinting a card or reissuing a link.
#
#
# `buyer` is which of the three in data/buyers.yml this offer was BUILT for, and
# `also_for` is who else it serves. The grouping is a second index over these same
# six records — it adds nothing to the price list, which is frozen by the gate.
#
# `checkout_mode` is how this offer can be paid for, and it is derived from the
# price rather than chosen:
#
#   fixed         one price, so one standing payment link. Only tier 1.
#   banded        the price lands inside a band, so a link is issued once the band
#                 is fixed for the case. A standing link cannot carry a range.
#   attached      priced against the depth band of the offer it attaches to, and
#                 never bought on its own.
#   deposit       the engagement is above the card threshold and goes by invoice,
#                 but a DEPOSIT against it is below the threshold, so that part is
#                 a payment link. Two amounts, two rails, one offer — and the
#                 deposit amount is frozen by the gate exactly like a price is.
#   conversation  above about £1,000 a card stops making sense. Invoice and bank
#                 transfer, or the cloud marketplace, after a conversation.
#   none          there is no code behind it.
#
# WHY TIER 4 HAS A DEPOSIT AND WHY IT IS £500. The pack already described tier 4
# as "a booking with a deposit" — the deposit is not new, it was simply not
# payable. What is new is that it is payable here, and the arithmetic that put
# tier 4 on the invoice rail is the reason it can be: the card fee argument was
# always about the £10,000, never about the deposit. At £10,000 a card costs up to
# about £250; at £500, on the same published rate, it is about £12. So the deposit
# is a payment link and the balance is not, and the gate holds the deposit below
# the threshold the site's own copy names.
#
# The number of these engagements that can be taken at once is limited. That limit
# is deliberately not on any page and no page implies one either way: a scarcity
# line is a sales device, and this site does not carry one. The consequence a buyer
# actually needs is in the flow rather than in a claim — the deposit follows the
# conversation and a written scope, so it is never taken from somebody who cannot
# be scheduled.
#
# HOW MUCH IS TAKEN ON SALE. `pay_now_pct` is the share of the price taken when
# the order is placed; the rest is due on delivery. It is 100 for the two levels
# that are produced without anybody being scheduled, and 20 for the two that are
# somebody's work — £100 of £500, £300 of £1,500. A deposit is how you sell an
# hour of a person from a card without either side carrying the whole risk of a
# thing a person does rather than a pipeline, and it works the same whether the
# card is tapped in a room or opened on a phone: the split is a property of the
# offer, not of the rail.
#
# Frozen in tools/check_site.py exactly as the prices are. A deposit that drifts
# is a price that drifted, and these go onto printed cards.
#
# `post_sale` is what the buyer reads AFTER paying, which is a different page from
# the delivery page they read before. It answers what happens now: when it arrives,
# what they have to do, how a key reaches them — never the key itself — and what
# "done" means, which is a commit they can check from the vault's own history.
#
# `post_url` is where the buyer goes after the money moves, and it is NOT on this
# site. riskmandate.ai publishes one page per level — paid-t1 to paid-t4 — and
# since its v1.19.2 the level-1 page IS the download: the zip, its size, its
# sha256, and a hash check that runs in the buyer's own browser. Duplicating that
# here would mean two copies of a size and a hash, and one of them would go stale.
# So the store's own /order/ page says what was bought and what is owed, and then
# hands the buyer over.
#
# `post_carries` is the query the handover is allowed to carry, and it is the whole
# contract: `order`, the store's reference, kept to letters, digits, dot, underscore
# and hyphen and at most 64 characters; and, at level 1 only, `shape`, the slug of
# the template — the same slug this store uses at /p/<slug>/, which is why keeping
# the slugs in step matters. Nothing else is read, nothing is posted, there is no
# callback and no session. The page is a static file and works with no query at all.
#
# TWENTY-FOUR HOURS, NOT "ONE WORKING DAY". The follow-up wording here was a day
# behind what riskmandate.ai commits to on its own pages, and two sites promising
# different things about the same follow-up is exactly the drift these two files
# are meant to stop. The number that stands is theirs, because it is theirs to keep.
#
# `checkout_url` is the payment link itself. EVERY ONE IS EMPTY, and that is the
# state of this rail rather than a placeholder somebody forgot: no payment link
# has been created for any offer on this site. The build renders a live button
# where a URL exists and says the link has not been issued where it does not, so
# pasting one line here is the whole of turning a checkout on. The gate holds each
# URL to the payment provider's own host, so a link cannot quietly become a
# redirect through anything else.
#
# `state` is what is true about the thing being sold TODAY. Two of the six do not
# exist yet and the pack says so; those sentences are not marketing copy to be
# softened, they are the reason the method is worth anything.

- id: t1
  tier: "1"
  short_name: Pack
  short_sub: "The material, downloaded."
  next_what: "The ABP files and instructions, packaged for you to keep."
  next_included:
    - The behaviour policy, the grant, the mandate and the delta
    - The agent instructions and the mapping prompt
    - Every file from the published vault, downloaded
    - A commercial licence to you over material that is public under CC BY
  next_excluded:
    - A vault you hold the keys to
    - Version history, or a read key you can hand on
    - Any correction for your deployment
  question: Can I just have the pack?
  price_label: "£10"
  price_min: 1000
  price_max: 1000
  price_why: "The floor, and it has moved twice. £10 on 10 September, because the fixed card fee is about four per cent of a fiver; £5 on 15 September by ruling anyway; £10 again on 16 September — and this time the number is not what changed. Two reviewers said £5 read as a commodity price for something sophisticated, and the answer to that is not a bigger number for the same thing. What you buy at this level is now a commercial licence over material that is public under CC BY, which is a different product rather than a dearer one"
  gets: "Every file in the vault for the shape you picked, downloaded by you — the behaviour policy, the grant and the mandate as markdown and as JSON, the pinned vocabulary, the prompts, the business case, and the two files you hand the agent — under a commercial licence to you, rather than under the attribution licence the same files carry in public."
  state_badge: exists
  state: "Built, and it runs today. Fifteen template shapes are published, and the pack for any of them is what this level sends."
  claim: abp-templates-exist
  rail: link
  buyer: agents
  also_for: [startups, investors]
  checkout_mode: fixed
  checkout_url: ""
  pay_now_pct: 100
  eta: "Immediately"
  eta_from: "the moment the payment goes through"
  eta_why: "Nothing is made to order. The pack exists before you arrive and the page you land on is the download."
  post_when: "Immediately. The page you land on after paying IS the download, with the size and the sha256 printed beside the link."
  post_does: "Download the zip and check the hash. The page does the hashing in your own browser, against the hash it publishes."
  post_done: "You hold the zip, and the hash computed in your browser matches the hash that shape publishes."
  post_check: "The check runs on the page. Nothing is uploaded and nothing is asked for."
  post_url: "https://store.sgit.ai/paid/t1/"
  post_upstream: "https://riskmandate.ai/paid-t1.html"
  post_carries: [order, shape]
  post_key: "Not applicable. There is no vault at this level and so there is no key."
  delivery_says:
    - "A download, on the page you land on the moment the payment goes through — the zip of the whole pack for the shape you chose, with its size and its sha256 beside it."
    - "**A commercial licence to you over everything in it.** The same files are published free under CC BY, which obliges you to attribute them wherever they end up. This licence removes that: use the pack in client work, inside a product, in a document that goes to a regulator, without carrying our name into it."
    - "The behaviour policy, the grant, the mandate, the delta and the barrier on each row."
    - "The prompts and documents you hand the agent, and the business case for a control."
  not_promised:
    - "Not a vault. No history, no app, and no read key to hand anybody — that is the level above."
    - "The licence does not make the files private. They stay public under CC BY for everybody else, and buying it does not take them down."
    - "Not corrected for you. The mandate in it is the starting mandate, written to be corrected, and correcting it is yours to do."

