# The offers. THIS FILE IS THE ONLY PLACE A PRICE EXISTS.
#
# FOUR LEVELS OF ONE THING, and two add-ons. Every level is the same document — an
# Agent Behaviour Policy for one agent in one deployment — and what changes is the
# form it arrives in and who does the correcting.
#
# THE PRICES CHANGED ON 15 SEPTEMBER 2026, BY RULING. The four tiers of the
# 10 September pack (£10, £50 to £100, £150 to £1,000, £5,000 to £10,000) were
# replaced by the project lead with £5, £50, £500 and £1,500. A price is not the
# builder's to invent and it IS the project lead's to set, so the frozen table in
# tools/check_site.py moved with these numbers, in the commit that says so. That
# mechanism is the point: the check did not loosen, it was re-pointed.
#
# THE IDENTIFIERS DID NOT CHANGE, and that is deliberate. t1 to t4 are printed on
# cards that are already made. A code still lands on /d/<id>/ and that page now
# describes the level rather than the old tier, which is the whole reason the pack
# said to keep the identifiers stable: a repricing costs no reprinting.
#
# `id` is the stable offer identifier. A payment link redirects to /d/<id>/ and
# nothing else about it is load-bearing, so the site can move host without
# reprinting a card or reissuing a link.
#
#
# `buyer` is which of the three in data/buyers.yml this offer was BUILT for, and
# `also_for` is who else it serves. The grouping is a second index over these same
# six records — it adds nothing to the price list, which is frozen by the gate.
#
# `checkout_mode` is how this offer can be paid for, and it is derived from the
# price rather than chosen:
#
#   fixed         one price, so one standing payment link. Only tier 1.
#   banded        the price lands inside a band, so a link is issued once the band
#                 is fixed for the case. A standing link cannot carry a range.
#   attached      priced against the depth band of the offer it attaches to, and
#                 never bought on its own.
#   deposit       the engagement is above the card threshold and goes by invoice,
#                 but a DEPOSIT against it is below the threshold, so that part is
#                 a payment link. Two amounts, two rails, one offer — and the
#                 deposit amount is frozen by the gate exactly like a price is.
#   conversation  above about £1,000 a card stops making sense. Invoice and bank
#                 transfer, or the cloud marketplace, after a conversation.
#   none          there is no code behind it.
#
# WHY TIER 4 HAS A DEPOSIT AND WHY IT IS £500. The pack already described tier 4
# as "a booking with a deposit" — the deposit is not new, it was simply not
# payable. What is new is that it is payable here, and the arithmetic that put
# tier 4 on the invoice rail is the reason it can be: the card fee argument was
# always about the £10,000, never about the deposit. At £10,000 a card costs up to
# about £250; at £500, on the same published rate, it is about £12. So the deposit
# is a payment link and the balance is not, and the gate holds the deposit below
# the threshold the site's own copy names.
#
# The number of these engagements that can be taken at once is limited. That limit
# is deliberately not on any page and no page implies one either way: a scarcity
# line is a sales device, and this site does not carry one. The consequence a buyer
# actually needs is in the flow rather than in a claim — the deposit follows the
# conversation and a written scope, so it is never taken from somebody who cannot
# be scheduled.
#
# `checkout_url` is the payment link itself. EVERY ONE IS EMPTY, and that is the
# state of this rail rather than a placeholder somebody forgot: no payment link
# has been created for any offer on this site. The build renders a live button
# where a URL exists and says the link has not been issued where it does not, so
# pasting one line here is the whole of turning a checkout on. The gate holds each
# URL to the payment provider's own host, so a link cannot quietly become a
# redirect through anything else.
#
# `state` is what is true about the thing being sold TODAY. Two of the six do not
# exist yet and the pack says so; those sentences are not marketing copy to be
# softened, they are the reason the method is worth anything.

- id: t1
  tier: "1"
  question: Can I just have the pack?
  price_label: "£5"
  price_min: 500
  price_max: 500
  price_why: "The floor, set by ruling on 15 September. The card fee is about four per cent of it, which was the reason £5 was ruled OUT as a floor on 10 September — the fee did not change, the judgement did, and the arithmetic stays on the page rather than being quietly dropped"
  gets: "Every file in the vault for the shape you picked, sent to you: the policy, the grant and the mandate as markdown and as JSON, the pinned vocabulary, the prompts, the business case, and the two files you hand the agent."
  state_badge: exists
  state: "Built, and it runs today. Fifteen template shapes are published, and the pack for any of them is what this level sends."
  claim: abp-templates-exist
  rail: link
  buyer: agents
  also_for: [startups, investors]
  checkout_mode: fixed
  checkout_url: ""
  delivery_says:
    - "One email, with the whole pack for the shape you chose."
    - "The policy, the grant, the mandate, the delta and the barrier on each row."
    - "The prompts and documents you hand the agent, and the business case for a control."
  not_promised:
    - "Not a vault. No history, no app, and no read key to hand anybody — that is the level above."
    - "Not corrected for you. The mandate in it is the starting mandate, written to be corrected, and correcting it is yours to do."

- id: t2
  tier: "2"
  question: Can I have a vault I hold the keys to?
  price_label: "£50"
  price_min: 5000
  price_max: 5000
  price_why: "The same material as the level below, as the thing itself rather than a copy of its contents. A vault is versioned, has its own app and can be handed to somebody with a read key, and none of that survives an email"
  gets: "A vault of your own with the pack in it, a licence carrying your name, and no public key on it."
  state_badge: exists
  state: "Built, and it runs today. A template shape is built into a vault by one command; yours is that, licensed to you, with the public key off it."
  claim: abp-vault-build-exists
  rail: link
  buyer: agents
  also_for: [startups, investors]
  checkout_mode: fixed
  checkout_url: ""
  delivery_says:
    - "A vault you hold the keys to: clone it, change it, commit, and the history is yours."
    - "Its own app, and a read key you can hand to anybody who asks how you govern the agent."
    - "A licence with your name on it, and no public key."
  not_promised:
    - "Not customised by us. It is the template licensed to you — the correction is still yours to make."
    - "Not a review. Nobody here has looked at your situation at this level."

- id: t3
  tier: "3"
  question: Can you correct it for my situation?
  price_label: "£500"
  price_min: 50000
  price_max: 50000
  price_why: "You send the industry, the use case and the details; the mandate is corrected against them and the delta recomputed. It is the first level where somebody other than you does the work that makes the document yours"
  gets: "The vault, with the mandate corrected against your situation rather than against a starting assumption, and a written note of what changed."
  state_badge: unrun
  state: "Specified, and never run for a paying buyer. The generator and the correction exist; this level as a product has not been sold once, and you would be the first."
  claim: abp-correction-unrun
  rail: link
  buyer: startups
  also_for: [agents, investors]
  checkout_mode: fixed
  checkout_url: ""
  delivery_says:
    - "Everything in the vault level, with the mandate corrected against what you told us."
    - "The delta recomputed against your corrected mandate, with the barrier on every row."
    - "A written note of what was changed and why, so the correction is checkable rather than trusted."
  not_promised:
    - "Not a call. Nobody interviews you at this level: you send the details and the work is done from them."
    - "Not signed by a named professional. That is the level above."
    - "Not a compliance assessment and not a risk score. An Agent Behaviour Policy describes and does not judge."

- id: t4
  tier: "4"
  question: Can somebody go through it with my team?
  price_label: "£1,500"
  price_min: 150000
  price_max: 150000
  price_why: "Two half-hour sessions — one to interview the team, one to deliver — plus the work between them and a security professional's review. It is the only level whose cost is somebody's time, and it is a fixed price rather than a band because two sessions is what is sold"
  gets: "Two half-hour sessions with your team, the policy built from the interview, and a security professional's review and sign-off."
  state_badge: unrun
  state: "Specified, and never run for a paying buyer. The sessions have not been held with anybody, and a first buyer would be the first run."
  claim: abp-sessions-unrun
  rail: link
  buyer: investors
  also_for: [agents, startups]
  checkout_mode: fixed
  checkout_url: ""
  delivery_says:
    - "Half an hour with your team to find out what is actually running."
    - "Half an hour to deliver it and walk through what came back."
    - "Everything in the corrected level, built from the interview rather than from a form."
    - "Reviewed and signed off by a security professional, with a record of what was asked and answered."
  not_promised:
    - "Not a signed opinion as a formal instrument. A professional reviewing and signing off the work is not the same thing as the company issuing a signed opinion, and the wording for that does not exist yet."
    - "Not an audit, an accreditation or a mark of conformity. None of those words describes this and none appears on the deliverable."
    - "Not a risk score. What the risk of your deployment is depends on your assets and is separate work."
    - "Not open-ended. Two sessions is what is sold; more is a separate conversation."

- id: add-formats
  tier: add-on
  question: Can I have the same result in a form the board will read?
  price_label: "By depth band"
  price_min: 0
  price_max: 0
  price_why: "Priced against the depth band of the offer it attaches to, because the work is the rendering and the rendering scales with what there is to render"
  gets: "The same result as a document, a deck, an infographic, and in a second language."
  state_badge: partial
  state: "The generator exists. The check that proves every variant carries the same facts does not, so the guarantee that would make this worth buying is not printed here yet."
  claim: fact-diff-absent
  rail: link
  buyer: any
  also_for: [agents, investors, startups]
  checkout_mode: attached
  checkout_url: ""
  delivery_says:
    - "The same result, in the formats you chose."
    - "The variant list, and the date each was rendered."
  not_promised:
    - "That the variants are fact-identical. That is the guarantee this add-on exists to make, it is mechanically checkable, and the check has not been built. Until it has, the claim is not on this page."

- id: add-opinion
  tier: add-on
  question: Will somebody put their name to it?
  price_label: "By depth band"
  price_min: 0
  price_max: 0
  price_why: "Priced against the depth band of the offer it attaches to"
  gets: "A reviewed opinion, issued by the company, signed by a named professional."
  state_badge: absent
  state: "The wording does not exist. It has to, before a first signature — so this add-on is listed and cannot yet be bought."
  claim: opinion-wording-absent
  rail: none
  buyer: investors
  also_for: []
  checkout_mode: none
  checkout_url: ""
  delivery_says:
    - "Nothing yet. This offer has no delivery page because it has no wording, and it is listed here so that nobody proposes it as new."
  not_promised:
    - "Availability. There is no code for this one and no checkout behind it."
