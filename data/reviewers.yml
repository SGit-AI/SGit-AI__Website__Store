# WHO RUNS THE REVIEW.
#
# The two upper levels are somebody's work and until 16 September this store had
# never said whose. Asking for £1,500 for a security review from nobody in
# particular is a worse problem than any price on this site, and it was the one
# thing a buyer at that level most needed and could not find.
#
# BUILT FOR A LIST FROM THE FIRST DAY, WITH ONE NAME ON IT. The project lead is
# contacting other security professionals and negotiating rates so they can take
# some of this work. Adding the second is adding a record to this file; the page,
# its markdown twin, the register and the links from the level pages are all
# generated.
#
# NOTHING HERE IS WRITTEN FROM WHAT ANYBODY TOLD US.
#
# Every line of a record carries the published page it was read from and the date
# it was read. A biography this site composed would be the single worst thing to
# stand next to a £1,500 price — and this store's whole argument is that its
# sentences can be checked, which is worth exactly nothing if it stops applying
# the moment the sentence is flattering.
#
# The one number that is NOT here is a count of years. The project lead offered
# "twenty years of cybersecurity" and it is almost certainly right; what is
# published is a record starting in 2008, and a reader can do that arithmetic
# themselves and check every step of it. A round number nobody can verify is
# weaker than a date that anybody can.
#
# One line per value: the YAML subset in build.py drops wrapped continuation lines.

_sources:
  - url: "https://open-source.sgit.ai/about/index.html"
    read: "16 September 2026"
    what: "The author page on open-source.sgit.ai, published CC BY 4.0. Every row of the record below is read off it."
  - url: "https://sgit.ai/demos/vaults/index.html"
    read: "16 September 2026"
    what: "The published vault catalogue, which is where the delivered work is."

