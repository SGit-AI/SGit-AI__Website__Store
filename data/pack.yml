# The store pack, as delivered — the manifest, and the reason it is a manifest
# rather than nineteen published pages.
#
# 04__THE-DEV-PACKS-AREA.md instructs that these documents be published on the
# site, and specifies the shape: an index, a folder per pack, compiled files
# rather than one file per record, and a pack.json listing every document with its
# title, date, version and content hash. It then names five checks that must pass
# BEFORE anything is published, says every one of them is "a real edit or a real
# hold", and records that who runs them is not decided.
#
# So the area exists and the documents do not. Two of the five checks are things a
# script can measure, and the numbers below are that measurement: 11 of the 19
# documents carry the word hard rule 1 bars from every page of a site that carries
# prices, and 4 carry the naming collision that was ruled on 8 September to block
# any public page. The other three checks need a person reading for tone.
#
# The hashes are published anyway. A reader who was handed this pack can check
# their copy against it without being able to read it here, which is the same
# discipline the pack asks of everything else: checkable by somebody who does not
# trust the page.

pack:
  id: store
  title: The store pack
  version: v0.33.69
  date: 10 September 2026
  documents: 19
  bytes: 392982
  zip_bytes: 152404
  zip_sha256: c162e944a53aff6db37c6de89316ef278d1f1d9f946d71d6c920711d0ae26136
  licence: CC BY 4.0
  state: held
  state_note: "The area is built. The documents are held pending the five checks in 04__THE-DEV-PACKS-AREA.md, none of which has been run by a person."

checks:
  - n: 1
    check: Audit every named third party for adjectives
    why: "Hard rule 8, the ruling of 20 August: publish the record, never the verdict. These were written for an internal reader, and internal briefs are blunt."
    who: A person reading for tone. A script cannot do this one.
    state: not run
  - n: 2
    check: Mark each document as model generated, on its face
    why: "Hard rule 5. The transparency article has applied since 2 August 2026 and reaches a third-country party whose output is used in the Union. The disclosure belongs on the document, not only in a site footer."
    who: Mechanical, once the documents are cleared to publish.
    state: not run
  - n: 3
    check: Verify or remove every unverified claim that names a company
    why: "A note saying unverified is honest inside a working document and a liability on a public page beside a company's name."
    who: A person, with the sources open.
    state: not run
  - n: 4
    check: Re-read the two documents with unresolved legal exposure
    why: "The parody research in the printed-surfaces brief, and any passage describing what a competitor's security does or does not do — marketing copy read on one day, not measurements."
    who: A person, and probably not only a person here.
    state: not run
  - n: 5
    check: Hold anything touching the open naming collision
    why: "Two phrases in this vocabulary mean opposite things and both are in use. Ruled on 8 September to block any public page until the collision is closed, and a published dev pack is a public page."
    who: "Measured below: 4 documents carry it. Closing the collision is a ruling, not an edit."
    state: measured, not resolved

