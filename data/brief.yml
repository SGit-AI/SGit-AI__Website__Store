# The brief. The option model behind every prototype in /lab/.
#
# WHAT THIS IS FOR. The consulting work being configured is two things: a MAP of
# the grants and mandates of the agents a company is already running, and the
# POLICY SET that would close the gap between them. Neither is automated yet. A
# team fulfils it. What /lab/ does is take the part a buyer knows — what is
# running, what it was granted, what it is meant to do — and turn it into a brief
# that team can start from, instead of a first call spent asking it.
#
# So the output is a JSON file, and the JSON file is the product of this page. The
# checkout is downstream of it. Everything below exists to make that file specific
# enough to be worth having.
#
# THE PRICE IS NOT INVENTED HERE, AND CANNOT BE. The pack's first rule about what
# may not be invented is a price, and tools/check_site.py freezes all six against
# it. So choosing more options does not compute a new number — it moves you along
# the ladder that already exists. Weighted options add up, the total lands in a
# band, and each band names one of the four tiers and ITS price. A configurator
# that emitted "£347" would be inventing a price with extra steps.
#
# THE THREE TRACKS are the three buyers in data/buyers.yml, asking the same
# question from different sides:
#   startups   — map it upwards, before somebody else asks
#   investors  — map what it is doing, on both sides of the company you back
#   agents     — map your own estate, because you are the one running it
#
# `implies_grants` is the prebaked part. Naming a surface pre-ticks what that
# surface normally holds — and the brief records where you UNTICKED one, because a
# grant somebody deliberately removed is more interesting than one never named.
#
# One line per value: the YAML subset in build.py drops wrapped continuation lines.

meta:
  id: brief
  schema: 1
  storage: sgit.store.brief.v1
  note: "Nothing in a brief leaves the browser. It is written to local storage and exported as a file you hold."

# ---------------------------------------------------------------------- tracks
tracks:
  - id: startups
    label: You are a startup
    verb: Map it upwards
    asks: "What does our estate look like to somebody who is about to ask?"
    story: "Diligence is coming. The questions are the same ones every time, and the difference between a good week and a bad one is whether the answers already exist in writing."
    frame: "You are mapping outwards: what you run, what it can reach, and what you would say about it under questioning."
    defaults: [map-grants, map-mandates, delta, policy-set]

  - id: investors
    label: You are an investor
    verb: Map both sides
    asks: "What is the agent in this company actually doing, and what was it allowed to do?"
    story: "You are backing a company that runs agents. The gap you care about is between what its credentials permit and what anybody there believes those agents do — and nobody in the company has drawn both halves on one page."
    frame: "You are mapping a company you do not operate: the permitted side from its credentials, the expected side from its own account, and the distance between them."
    defaults: [map-grants, map-mandates, delta, review]

  - id: agents
    label: You run agents today
    verb: Map your estate
    asks: "What did we actually grant the things we are already running?"
    story: "The agents are in production. The credentials were issued over months by different people for different reasons, and no single document says what the union of them permits."
    frame: "You are mapping your own estate: every surface, the credential behind it, the behaviour it was issued for, and the excess authority between the two."
    defaults: [map-grants, map-mandates, delta, policy-set, reg-slice]

# -------------------------------------------------------------------- sections
sections:
  - id: surfaces
    n: 1
    title: What is running
    question: Which of these is already in your environment?
    why: "Every one you name becomes a node in the map. Anything you do not name cannot be mapped, and the brief says which ones you were unsure about rather than leaving them out."
    kind: multi
    weight: 1
    options:
      - id: coding-agent
        label: A coding assistant with a shell
        note: "Runs where the code is, and can usually do anything the developer can."
        implies_grants: [repo-write, local-fs, ci-secrets]
        implies_mandates: [ship-code]
      - id: app-builder
        label: A hosted app builder
        note: "Generates and deploys a front end, and holds the deploy credential to do it."
        implies_grants: [deploy, third-party-host]
        implies_mandates: [ship-code]
      - id: ci-agent
        label: An agent inside the build
        note: "Runs unattended on every push, with whatever the build secrets reach."
        implies_grants: [ci-secrets, repo-write, cloud-console]
        implies_mandates: [run-ci]
      - id: support-agent
        label: A customer support agent
        note: "Answers people who do not know they are talking to one."
        implies_grants: [customer-records, send-email]
        implies_mandates: [answer-customers, triage]
      - id: payments
        label: An agent touching payments
        note: "Anything that can read a charge can usually do more than read one."
        implies_grants: [payment-api, spend]
        implies_mandates: [refund]
      - id: internal-assistant
        label: An internal assistant over your own documents
        note: "Reads the material nobody meant to classify."
        implies_grants: [internal-docs]
        implies_mandates: [summarise]
      - id: automation
        label: A workflow automation with steps a model writes
        note: "The connectors outlive whoever wired them."
        implies_grants: [send-email, internal-docs, third-party-host]
        implies_mandates: [triage]
      - id: data-agent
        label: An agent with a database connection
        note: "Read-only is a setting, and settings are changed by people in a hurry."
        implies_grants: [prod-db]
        implies_mandates: [summarise]
      - id: voice-agent
        label: A voice or phone agent
        note: "Speaks as the company, in real time, with no review step."
        implies_grants: [customer-records, send-email]
        implies_mandates: [answer-customers]
      - id: infra-agent
        label: An agent that provisions infrastructure
        note: "Creates and destroys the place everything else runs."
        implies_grants: [cloud-console, spend]
        implies_mandates: [provision]

  - id: grants
    n: 2
    title: What it was granted
    question: What does the credential behind each of those actually permit?
    why: "This is the permitted half of the delta. Tick what the credential CAN do, not what anybody intends to use it for — that is the next question, and keeping them apart is the entire method."
    # `justified_by` is the edge that makes the delta computable rather than drawn.
    # A grant is EXCESS when it is permitted and no mandate you selected would need
    # it. That is the whole product in one line of arithmetic, and it is here in
    # data so a reader can disagree with a specific edge rather than with a result.
    kind: multi
    weight: 1
    options:
      - id: repo-write
        label: Write to your repositories
        justified_by: [ship-code, run-ci]
        weight_note: "Write is also the ability to change what runs next."
      - id: ci-secrets
        label: Read the build's secrets
        justified_by: [run-ci]
      - id: cloud-console
        label: The cloud console or its API
        justified_by: [provision, run-ci]
      - id: deploy
        label: Deploy to production
        justified_by: [ship-code, provision]
      - id: prod-db
        label: The production database
        justified_by: [summarise]
      - id: payment-api
        label: The payment API
        justified_by: [refund]
      - id: spend
        label: Spend money
        justified_by: [provision, refund]
      - id: customer-records
        label: Customer records
        justified_by: [answer-customers, triage]
      - id: send-email
        label: Send mail as the company
        justified_by: [answer-customers, triage]
      - id: internal-docs
        label: Internal documents and chat history
        justified_by: [summarise, triage]
      - id: third-party-host
        label: A third party's host, holding your data
        justified_by: [ship-code]
      - id: local-fs
        label: A developer's filesystem, whatever is on it
        justified_by: [ship-code]

  - id: mandates
    n: 3
    title: What it is supposed to do
    question: What is each of them actually authorised and expected to do?
    why: "This is the expected half. The delta is the gap between this list and the one above, so a brief with an empty list here has nothing to compute and says so on its own face."
    kind: multi
    weight: 1
    options:
      - id: ship-code
        label: Propose changes a person reviews before they land
      - id: run-ci
        label: Run the build and report on it
      - id: answer-customers
        label: Answer customer questions
      - id: triage
        label: Triage and route, without deciding
      - id: summarise
        label: Summarise internal material for people who may read it
      - id: refund
        label: Issue refunds up to a stated limit
      - id: provision
        label: Create and destroy environments on request
      - id: research
        label: Read public sources and report back
      - id: none-written
        label: Nothing is written down anywhere
        note: "A real answer, and the most common one. It is recorded as a finding rather than a blank."

  - id: wants
    n: 4
    title: What you want out of it
    question: Which of these should the team produce?
    why: "Each line is a deliverable with a state. Two of them do not exist yet, they are on the list anyway, and the brief carries the reason rather than dropping the row."
    # Weight 1, like every other section. This section used to weigh 2, and the
    # effect was that four of the five prebaked scenarios landed on the same tier —
    # the deliverable list swamped the estate, so the price stopped responding to
    # the thing it is supposed to respond to. What a deliverable does instead is
    # set a FLOOR: ask for a team assessment and no amount of counting puts you
    # below the tier that is a team assessment. Count decides the width, the
    # deliverable decides the minimum.
    kind: multi
    weight: 1
    options:
      - id: map-grants
        label: The grant map
        gives: "Every surface you named, and what its credential permits. One node per surface, one edge per grant."
      - id: map-mandates
        label: The mandate map
        gives: "The same surfaces, against what each is authorised and expected to do."
      - id: delta
        label: The delta between the two
        gives: "The excess authority: permitted, and not expected. This is the thing the whole method is for."
        offer: t1
      - id: policy-set
        label: A policy set that would close it
        gives: "Written against the estate you just described rather than against a template. One policy per gap, each naming the grant it constrains."
      - id: reg-slice
        label: Only the provisions of the regulation that reach you
        gives: "A selection from a published regulation, with the fact about your situation that caused each provision to arrive beside it."
        offer: t2
      - id: review
        label: A person reviewing it with you
        gives: "A time, confirmed, with what they read beforehand and what you get in writing afterwards."
        offer: t3
      - id: team
        label: An assessment by a team
        gives: "A scope in writing, a deposit against it, and the seven roles that will run."
        offer: t4
      - id: formats
        label: The same result as a deck and a document
        gives: "The result rendered for a reader who will not open a vault."
        offer: add-formats
      - id: opinion
        label: A signed opinion
        gives: "A reviewed opinion, issued by the company and signed by a named professional."
        offer: add-opinion

  - id: depth
    n: 5
    title: How the answers are evidenced
    question: How much of this should be taken on your word?
    why: "The cheapest version of this work is your own account, written down properly. The expensive version is somebody checking it. Both are real products and the difference is stated rather than assumed."
    kind: single
    weight: 1
    options:
      - id: declared
        label: Our account, written down properly
        note: "Nothing is measured. The brief says so on its face, and so does anything built from it."
        weight: 0
      - id: measured
        label: Measure the grants against the credentials
        note: "The permitted half stops being an opinion."
        weight: 2
      - id: reproduced
        label: Reproduce every finding before it reaches us
        note: "Recall-optimised agents run at 0.388 precision, so a finding that has not been reproduced is three-in-five wrong."
        weight: 5

# ----------------------------------------------------------------------- bands
# Where a total lands, and which EXISTING tier that band names. No band computes a
# number: it points at a price that was set elsewhere and frozen by the gate.
bands:
  - id: b1
    up_to: 8
    offer: t1
    says: "A small estate, your own account of it, and the delta between the two halves."
  - id: b2
    up_to: 18
    offer: t2
    says: "Enough surfaces that the map is worth drawing, and the regulation slice attached to it."
  - id: b3
    up_to: 34
    offer: t3
    says: "Wide enough that somebody should read it with you rather than hand it over."
  - id: b4
    up_to: 9999
    offer: t4
    says: "An estate, not a project. This one starts with a conversation and a written scope."

# ------------------------------------------------------------------- scenarios
# Prebaked starts. Each is a real shape somebody arrives in, and every one of them
# is a HYPOTHESIS rather than a survey finding — nobody has counted how common
# these are, and the brief says which scenario it started from so that the team
# reading it knows what was assumed rather than answered.
scenarios:
  - id: ship-fast
    track: startups
    label: Shipping fast, two people, everything wired to everything
    note: "A coding assistant with a shell, a hosted app builder, and one automation nobody has looked at since it was wired."
    surfaces: [coding-agent, app-builder, automation]
    grants: [repo-write, local-fs, ci-secrets, deploy, third-party-host, send-email]
    mandates: [ship-code, none-written]
    wants: [map-grants, map-mandates, delta, policy-set]
    depth: measured

  - id: support-desk
    track: agents
    label: An agent answering customers, and a support desk behind it
    note: "The one where the grant nobody questions is the customer record, because answering questions obviously needs it."
    surfaces: [support-agent, internal-assistant]
    grants: [customer-records, send-email, internal-docs]
    mandates: [answer-customers, triage]
    wants: [map-grants, map-mandates, delta, policy-set, reg-slice]
    depth: measured

  - id: money-path
    track: agents
    label: Something on the payment path
    note: "The smallest estate on this list and the one with the shortest distance between a mistake and a refund."
    surfaces: [payments, ci-agent]
    grants: [payment-api, spend, ci-secrets, repo-write]
    mandates: [refund, run-ci]
    wants: [map-grants, map-mandates, delta, policy-set, reg-slice, review]
    depth: reproduced

  - id: portfolio-look
    track: investors
    label: One portfolio company, both sides of it
    note: "The permitted side from their credentials, the expected side from their own account, and the distance between them."
    surfaces: [coding-agent, ci-agent, support-agent, data-agent]
    grants: [repo-write, ci-secrets, cloud-console, deploy, prod-db, customer-records]
    mandates: [ship-code, run-ci, answer-customers]
    wants: [map-grants, map-mandates, delta, review, opinion]
    depth: reproduced

  - id: full-estate
    track: agents
    label: A whole estate, issued by different people over a year
    note: "Nobody wrote the union of these down, which is the reason it is worth writing down."
    surfaces: [coding-agent, ci-agent, support-agent, internal-assistant, automation, data-agent, infra-agent]
    grants: [repo-write, ci-secrets, cloud-console, deploy, prod-db, customer-records, send-email, internal-docs, third-party-host, spend]
    mandates: [ship-code, run-ci, answer-customers, triage, summarise, provision]
    wants: [map-grants, map-mandates, delta, policy-set, reg-slice, team, formats]
    depth: reproduced
