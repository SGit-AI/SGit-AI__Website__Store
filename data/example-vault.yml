# THE WORKED EXAMPLE A BUYER SEES ON THE PAGE THEY LAND ON AFTER PAYING.
#
# "When you have sold a vault, you should just see the vault." The difficulty is
# that at the moment somebody pays there is nothing of THEIRS to show: at the
# vault level it is built for them within a day or two, and at the two upper
# levels it is built after they send their details. A page that pretended
# otherwise would be lying at the one moment a buyer is paying most attention.
#
# So what is embedded is a published vault of exactly this kind of work, labelled
# as an example in the first sentence. It is the difference between "your thing is
# coming" and "here is what one of these is, open it now" — and for a buyer who
# has never held a vault, the second is the useful one.
#
# NO KEY THAT CAN WRITE, AND NOTHING PRIVATE. This is a read key sgit.ai
# deliberately publishes on that vault's own page. It opens the vault and cannot
# write to it, which was verified by cloning with one.

