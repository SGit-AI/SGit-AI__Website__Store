# The payment rails, and what the store hands each of them.
#
# SUMUP CAME OFF ON 16 SEPTEMBER, FOR THE FIRST END-TO-END STORE. Stripe works:
# six products priced, three coupons, and a reconciliation running on every
# release. A second rail that is half set up is a second thing to explain on a
# selling page and a second thing to keep true, and the MVP does not need
# either. The plan for it is kept at /admin/rails/sumup/ rather than deleted,
# marked parked, so turning it back on is restoring a record instead of
# rediscovering an argument.
#
# NOTHING IS COLLECTED HERE. The store never sees a name, an email or a card: the
# provider's own page collects all three, which is the only place a card number
# should ever be typed. There is no form, input, textarea or select anywhere in
# this site's output and a build check holds that line — so the cart is built out
# of buttons and the customer's details are the provider's to take.
#
# WHAT REACHES THE PROVIDER. The amount, and an order reference that carries the
# SKUs. The reference is generated in the browser, shown on the page, and passed
# on the URL. Match it against the name and contact the provider captured and you
# have the whole order: who, how to reach them, and exactly what they bought.
#
# THE PROVIDER DOES GET A CATALOGUE, AND THAT REVERSED ON 16 SEPTEMBER. This used
# to say sixty-two SKUs maintained twice is sixty-two SKUs that will disagree.
# The objection was sized wrong: a price here does not vary by shape, so Stripe
# needs six products rather than sixty-two, and what the catalogue buys is a
# buyer who becomes a CUSTOMER with an email rather than an anonymous card
# charge — including a buyer handed a hundred-per-cent code. The drift is real
# and is reconciled on every release against the dashboard's own export.
#
# THE WALLET IS A SIMULATION AND SAYS SO FIRST. Until a real payment link exists
# on either rail, the store carries a demonstration wallet: a balance in the
# reader's own browser, debited by an order, with the spend on a page rather than
# in a panel. It charges nothing, there is no account, and nothing leaves the
# browser — the same shape pt.newsroom.sgit.ai uses for its per-page wallet, and
# the same discipline: a checkout that did not admit to being a demonstration
# would be the one dishonest thing on a site whose whole argument is checkability.
#
# It exists so the flow can be walked end to end — catalogue, order, payment, and
# the page that says what happens now — before a single real link is issued. When
# the links arrive the wallet does not need removing: it stays as the rail
# labelled "simulated", and the gate refuses to let it be the only one that looks
# real.
#
# THE LIVE URL IS EMPTY. No payment link has been created. The cart
# renders the button as unissued and says which rail is missing rather than
# showing something that looks live. Pasting one line here turns a rail on.

meta:
  order_prefix: SG
  note: "An order reference is generated in the browser. It is not an account and nothing is stored anywhere but the browser that made it."

rails:
  - id: wallet
    name: the demonstration wallet
    n: 0
    url: ""
    hosts: []
    ref_param: ""
    amount_param: ""
    simulated: true
    kind: "A balance in your own browser. It charges nothing and nothing leaves this page."
    takes: "Nothing. There is no account, no card and no name — the balance is local storage on your own machine and it goes when you clear site data."
    note: "Here so the whole flow can be walked before a real link exists. It is labelled on every screen it appears on."

  - id: contactless
    name: Contactless, in person
    n: 3
    url: ""
    hosts: []
    ref_param: ""
    amount_param: ""
    simulated: false
    kind: "A card tapped on a terminal at the stand, for the amount due now."
    takes: "Name, contact and card, on the terminal. The order reference is written on the receipt."
    note: "The deposit split works the same here as online: what is taken on the tap is the amount due now, and the rest is invoiced on delivery. The rail changes; the offer does not."

  - id: stripe
    name: Stripe
    n: 1
    url: ""
    hosts: [https://buy.stripe.com/, https://checkout.stripe.com/]
    ref_param: client_reference_id
    amount_param: ""
    kind: "A payment link that takes the amount the buyer enters."
    takes: "Name, email and card, on Stripe's own pages."
    note: "Set up already. The link has not been created."
